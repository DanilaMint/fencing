[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/perceptron",
    "crates/strategist",
    "crates/eugenics",
]
# Без этого `cargo test` проверял бы только корневой крейт:
# список участников по умолчанию включает все крейты рабочего пространства
default-members = [
    ".",
    "crates/core",
    "crates/engine",
    "crates/perceptron",
    "crates/strategist",
    "crates/eugenics",
]

[package]
name = "fencing"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2"
serde_json = "1"
fencing-core = { path = "crates/core" }
fencing-engine = { path = "crates/engine" }
fencing-perceptron = { path = "crates/perceptron" }
fencing-strategist = { path = "crates/strategist" }
fencing-eugenics = { path = "crates/eugenics" }

[profile.release]
# Максимальная оптимизация кода
opt-level = 3
lto = "fat"
codegen-units = 1

# Никаких проверок в release
debug-assertions = false
overflow-checks = false
incremental = false

# Убрать отладочные символы и метаданные из бинаря
debug = false
strip = "symbols"
