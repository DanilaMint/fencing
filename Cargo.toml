[package]
name = "fencing"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.27"
macroquad = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
# Максимальная оптимизация кода
opt-level = 3
lto = "fat"
codegen-units = 1

# Никаких проверок в release
debug-assertions = false
overflow-checks = false
incremental = false

# Убрать отладочные символы и метаданные из бинаря
debug = false
strip = "symbols"
